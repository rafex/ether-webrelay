# Ether WebRelay — sitio estático. TLS se termina delante (proxy/ingress):
# fuera de localhost el navegador exige HTTPS para capturar cámara y pantalla.
# El token de invitación viaja en la query (`/join/<sala>?t=<token>`): el log usa `$uri`
# (sin query) en lugar de `$request`/`$request_uri`, que lo copiarían a `kubectl logs`.
log_format webrelay '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    access_log /dev/stdout webrelay;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Solo GET/HEAD: es un sitio estático.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    # Una petición normal cabe de sobra; evita cabeceras gigantes.
    large_client_header_buffers 4 8k;
    client_body_buffer_size 1k;
    client_max_body_size 1k;

    # mime.types (heredado de nginx.conf) ya mapea .wasm → application/wasm.
    # No redefinir `types` aquí: reemplazaría el mapa completo.

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/webrelay/security-headers.conf;
        return 200 "ok\n";
    }

    # Configuración de despliegue: nunca en caché (se regenera al arrancar).
    location = /config.json {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/webrelay/security-headers.conf;
        try_files $uri =404;
    }

    # Las source maps no se publican (el build ya no las genera); por si alguna se colara.
    location ~* \.map$ {
        access_log off;
        return 404;
    }

    # Assets con hash en el nombre: inmutables.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/webrelay/security-headers.conf;
        include /tmp/webrelay-csp.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/webrelay/security-headers.conf;
        include /tmp/webrelay-csp.conf;
        try_files $uri /index.html;
    }
}
