# Ether WebRelay — sitio estático. TLS se termina delante (proxy/ingress):
# fuera de localhost el navegador exige HTTPS para capturar cámara y pantalla.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # mime.types (heredado de nginx.conf) ya mapea .wasm → application/wasm.
    # No redefinir `types` aquí: reemplazaría el mapa completo.

    # Captura solo desde este origen; el puente se alcanza por wss:// (o ws://localhost en desarrollo).
# connect-src incluye storage.googleapis.com por el modelo de efectos por defecto;
# si lo autoalojas (effectsModelUrl: /models/…) puedes quitarlo.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), speaker-selection=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' wss: ws://localhost:* ws://127.0.0.1:* blob: https://storage.googleapis.com; media-src 'self' blob:; img-src 'self' data: blob: https:; style-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Configuración de despliegue: nunca en caché (se regenera al arrancar).
    location = /config.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Assets con hash en el nombre: inmutables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), speaker-selection=(self)" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), speaker-selection=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' wss: ws://localhost:* ws://127.0.0.1:* blob: https://storage.googleapis.com; media-src 'self' blob:; img-src 'self' data: blob: https:; style-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri /index.html;
    }
}
