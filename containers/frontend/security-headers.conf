# Cabeceras de seguridad comunes (se incluyen en cada `location`: en nginx un
# `add_header` dentro de un bloque anula todos los heredados del nivel superior).
# El CSP no está aquí: depende del puente configurado y lo genera
# 40-webrelay-config.sh en /tmp/webrelay-csp.conf.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
# Captura solo desde este origen; nada más de lo que el navegador ofrece.
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), speaker-selection=(self), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
# El TLS lo termina el proxy delante; el navegador solo hace caso a HSTS sobre HTTPS.
# Sin `preload`: es una decisión irreversible sobre el dominio entero.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
