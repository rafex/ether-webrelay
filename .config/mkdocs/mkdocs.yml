site_name: Ether WebRelay
site_description: Relay de navegador — captura, WebCodecs y WebSocket hacia un puente RTMPS
site_author: rafex
repo_url: https://github.com/rafex/ether-webrelay

docs_dir: ../../docs
site_dir: ../../site

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Inicio: index.md
  - Guía de inicio: getting-started.md
  - Arquitectura: architecture.md
  - Protocolo v1: protocol.md
  - Manuales de tareas:
      - install: man_install.md
      - build: man_build.md
      - typecheck: man_typecheck.md
      - test: man_test.md
      - test-unit: man_test-unit.md
      - test-integration: man_test-integration.md
      - coverage: man_coverage.md
      - lint: man_lint.md
      - format: man_format.md
      - clean: man_clean.md
      - docs: man_docs.md
      - runtime: man_runtime.md
      - image: man_image.md
      - ci: man_ci.md
      - app-image: man_app-image.md
      - pre-commit: man_pre-commit.md
      - pre-push: man_pre-push.md
      - commit-msg: man_commit-msg.md
      - setup: man_setup.md
      - verify: man_verify.md
      - dev: man_dev.md
      - preview: man_preview.md
      - up: man_up.md
      - down: man_down.md
      - logs: man_logs.md

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
